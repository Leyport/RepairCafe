<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RepairCafe Docs</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0a1e;
      color: rgba(255,255,255,0.85);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      text-align: center;
      padding: 3rem 4rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      max-width: 480px;
    }
    .logo {
      width: 96px;
      height: 96px;
      margin: 0 auto 1.5rem;
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(45deg, #fff, #00f2ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    p {
      color: rgba(255,255,255,0.5);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    a.btn {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: #00f2ff;
      color: #000;
      font-weight: 700;
      font-size: 1rem;
      border-radius: 8px;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    a.btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="96" height="96">
        <circle cx="32" cy="32" r="32" fill="#1a0a2e"/>

        <circle cx="28" cy="29" r="1.8" fill="#1a0a2e"/>

    </div>
    <h1>RepairCafe</h1>
    <p>Modern repair tracking for a sustainable future.<br>Read the user manual to get started.</p>
    <a class="btn" href="user-manual.html">Open User Manual</a>
  </div>
</body>
</html>
