<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#1a0a2e"/>

  <!-- Blue hair / tuft on top -->
  <ellipse cx="24" cy="17" rx="4" ry="6" fill="#00c8ff" transform="rotate(-20 24 17)"/>
  <ellipse cx="32" cy="14" rx="4" ry="7" fill="#00b8f0"/>
  <ellipse cx="40" cy="17" rx="4" ry="6" fill="#00c8ff" transform="rotate(20 40 17)"/>

  <!-- Octopus body (purple) -->
  <ellipse cx="32" cy="30" rx="13" ry="12" fill="#8b3fc8"/>
  <!-- Body highlight -->
  <ellipse cx="29" cy="26" rx="5" ry="4" fill="#a855e8" opacity="0.5"/>

  <!-- Eyes -->
  <circle cx="27" cy="28" r="3.5" fill="white"/>
  <circle cx="37" cy="28" r="3.5" fill="white"/>
  <circle cx="28" cy="29" r="1.8" fill="#1a0a2e"/>
  <circle cx="38" cy="29" r="1.8" fill="#1a0a2e"/>
  <!-- Eye shine -->
  <circle cx="28.8" cy="28.2" r="0.7" fill="white"/>
  <circle cx="38.8" cy="28.2" r="0.7" fill="white"/>

  <!-- Smile + tongue -->
  <path d="M27 33 Q32 37 37 33" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="32" cy="36" rx="2.5" ry="2" fill="#ff6b9d"/>

  <!-- Gold necklace -->
  <path d="M22 36 Q32 41 42 36" stroke="#f5c518" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Tentacles (pink/purple) -->
  <!-- Left outer: holding hammer -->
  <path d="M20 35 Q10 38 8 46 Q10 50 14 48" stroke="#d966b0" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Hammer head -->
  <rect x="5" y="44" width="9" height="5" rx="1.5" fill="#888" transform="rotate(-30 5 44)"/>
  <rect x="11" y="40" width="2" height="10" rx="1" fill="#c8a064" transform="rotate(-30 11 40)"/>

  <!-- Left inner: holding wrench -->
  <path d="M23 40 Q16 44 18 52" stroke="#d966b0" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Wrench -->
  <path d="M14 53 Q16 50 20 52 Q22 48 20 46 Q16 45 14 48 Z" fill="#999" stroke="#666" stroke-width="0.5"/>

  <!-- Right inner tentacle -->
  <path d="M41 40 Q48 44 46 52" stroke="#d966b0" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Right outer tentacle: holding screwdriver -->
  <path d="M44 35 Q54 38 56 46 Q54 50 50 48" stroke="#d966b0" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Screwdriver -->
  <rect x="50" y="43" width="2.5" height="11" rx="1" fill="#aad4ff" transform="rotate(30 50 43)"/>
  <rect x="50" y="42" width="4" height="3.5" rx="0.5" fill="#888" transform="rotate(30 50 42)"/>

  <!-- Bottom tentacles -->
  <path d="M27 41 Q24 50 20 55 Q22 58 25 56" stroke="#c050a0" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M32 43 Q32 53 30 58 Q33 60 35 58" stroke="#c050a0" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M37 41 Q40 50 44 55 Q42 58 39 56" stroke="#c050a0" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Brown plank banner at bottom -->
  <rect x="8" y="56" width="48" height="10" rx="3" fill="#8B5A2B"/>
  <rect x="8" y="56" width="48" height="2" rx="1" fill="#a0693a"/>
  <!-- Banner text -->
  <text x="32" y="64" font-family="Arial,sans-serif" font-size="5.5" font-weight="bold" fill="#fff8e0" text-anchor="middle" letter-spacing="0.5">REPAIR CAFE</text>
</svg>
