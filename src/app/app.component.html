<div class="container">
  <header>
    <div class="header-top">
      <h1 routerLink="/">RepairCafe</h1>
      <div class="header-actions">
        <a routerLink="/admin" class="btn-admin">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
          </svg>
          Admin
        </a>
        <a routerLink="/issues" class="btn-issues">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          Issues
          <span class="badge" *ngIf="(issueCount$ | async) as count">{{ count }}</span>
        </a>
        <a routerLink="/schedule" class="btn-new"
          style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);">
          📅 Schedule
        </a>
        <a routerLink="/new" class="btn-new">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          New Repair
        </a>
      </div>
    </div>
    <p class="subtitle">
      Modern repair tracking for a sustainable future.
    </p>
  </header>

  <main>
    <router-outlet></router-outlet>
  </main>

  <footer>
    <div class="footer-content">
      <div class="footer-left">
        &copy; 2026 RepairCafe. Built with Antigravity.
      </div>
      <div class="footer-right">
        <span class="version-tag">{{ version }}</span>
        <span class="version-description">{{ changeDescription }}</span>
      </div>
    </div>
  </footer>
</div>

<style>
  .badge {
    background: rgba(255, 69, 0, 0.9);
    color: white;
    font-size: 0.75rem;
    padding: 0.15rem 0.5rem;
    border-radius: 99px;
    margin-left: 0.6rem;
    font-weight: 700;
    min-width: 1.4em;
    text-align: center;
    box-shadow: 0 2px 5px rgba(255, 69, 0, 0.4);
    display: inline-block;
    vertical-align: middle;
  }
</style>
