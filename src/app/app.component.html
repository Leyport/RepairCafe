<div class="container">
  <header>
    <div class="header-top">
      <h1 routerLink="/">RepairCafe</h1>
      <div class="header-actions">
        <a routerLink="/admin" class="btn-admin">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
          </svg>
          Admin
        </a>
        <a routerLink="/new" class="btn-new">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          New Repair
        </a>
      </div>
    </div>
    <p class="subtitle">
      Modern repair tracking for a sustainable future.
    </p>
  </header>

  <main>
    <router-outlet></router-outlet>
  </main>

  <footer>
    <div class="footer-content">
      <div class="footer-left">
        &copy; 2026 RepairCafe. Built with Antigravity.
      </div>
      <div class="footer-right">
        <span class="version-tag">{{ version }}</span>
        <span class="version-description">{{ changeDescription }}</span>
      </div>
    </div>
  </footer>
</div>
