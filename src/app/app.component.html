<div class="container">
  <header>
    <div class="header-top">
      <div class="home-area">
        <a class="home-btn" routerLink="/" title="Go to home">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span class="home-label">RepairCafe</span>
        </a>
        <span class="header-version">{{ (appVersion$ | async)?.version }}</span>
      </div>
      <div class="header-controls">
        <div class="header-actions">
          <ng-container *ngIf="user$ | async">
            <a routerLink="/admin" class="btn-admin" title="Admin Dashboard">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="9" y1="3" x2="9" y2="21"></line>
              </svg>
            </a>
            <a routerLink="/issues" class="btn-issues" title="Issues Log">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
              </svg>
              <span class="badge" *ngIf="(issueCount$ | async) as count">{{ count }}</span>
            </a>
            <a routerLink="/schedule" class="btn-sessions" title="Session Schedule &amp; Dashboards">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
              <span>Sessions</span>
            </a>
            <a routerLink="/analytics" class="btn-sessions" title="Analytics Dashboard">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="20" x2="18" y2="10"></line>
                <line x1="12" y1="20" x2="12" y2="4"></line>
                <line x1="6" y1="20" x2="6" y2="14"></line>
              </svg>
              <span>Analytics</span>
            </a>
            <button class="btn-new" (click)="createNewRepair()" [disabled]="isCreatingRepair" title="New Repair Record">
              {{ isCreatingRepair ? '...' : 'New' }}
            </button>
          </ng-container>
        </div>

        <div class="user-actions">
          <ng-container *ngIf="user$ | async as user; else loginButtons">
            <span class="user-name">Welcome, {{ user.displayName || user.email }}</span>
            <button (click)="logout()" class="btn-login" title="Logout">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
              </svg>
            </button>
          </ng-container>
          <ng-template #loginButtons>
            <button (click)="showLogin = true" class="btn-login" title="Login with Email">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </button>
            <button (click)="loginGoogle()" class="btn-login" title="Login with Google">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path
                  d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z">
                </path>
              </svg>
            </button>
            <button (click)="loginApple()" class="btn-login" title="Login with Apple">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path
                  d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.74.79 0 2.08-.71 3.29-.69 1.12.02 2.6.46 3.4 1.54-3.1 1.82-2.57 5.86.34 7.21-.65 1.77-1.47 3.23-2.11 4.17zM11.95 4.9C11.5 2.1 14.28 0 16.7.12c.56 2.72-2.88 5.14-4.75 4.78z">
                </path>
              </svg>
            </button>
          </ng-template>
        </div>
      </div>
    </div>

    <app-login *ngIf="showLogin" (close)="showLogin = false"></app-login>

    <p class="subtitle">
      Modern repair tracking for a sustainable future.
    </p>
  </header>

  <main>
    <router-outlet></router-outlet>
  </main>

  <footer>
    <div class="footer-content">
      <div class="footer-left">
        &copy; 2026 RepairCafe. Built with Antigravity.
        <a href="/docs/user-manual.html" target="_blank" class="manual-link">User Manual</a>
      </div>
      <div class="footer-right">
        <ng-container *ngIf="appVersion$ | async as v">
          <span class="version-tag">{{ v.version }}</span>
          <span class="version-description">{{ v.description }}</span>
        </ng-container>
      </div>
    </div>
  </footer>
</div>
